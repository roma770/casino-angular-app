<div class="app-layout">
  <aside class="sidebar">
    <div class="logo">
      <span class="icon">🚀</span>
      <span class="text">COSMO<strong>ROOM</strong></span>
    </div>
    
    <nav class="sidebar-nav">
      <a routerLink="/lobby" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">🏠 Головна</a>
      <a href="#" class="disabled">👑 Провайдери</a>
      <a routerLink="/play/slots" routerLinkActive="active">🎰 Слоти</a>
      <a href="#" class="disabled">🃏 Live казино</a>
      <a href="#" class="disabled">⚡ Швидкі ігри</a>
      <a href="#" class="disabled">🎁 Бонуси</a>
      <a href="#" class="disabled">🏆 Турніри</a>
      <a href="#" class="disabled">🔥 Акції</a>
      <a href="#" class="disabled">💬 Чат</a>
      <a href="#" class="disabled">ℹ️ FAQ</a>
    </nav>
  </aside>

  <div class="main-wrapper">
    <header class="top-header">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="Пошук">
      </div>
      
      <div class="header-actions">
        <button class="btn-promo">COSMOFEST</button>
        <div class="balance-box">
          <span class="amount">{{ userService.balance() }} ₴</span>
          <button class="btn-deposit" (click)="openCashier()">+</button>
        </div>
      </div>
    </header>

    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

@if (isCashierOpen) {
  <div class="modal-overlay" (click)="closeCashier()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeCashier()">×</button>
      
      <h2>Поповнення рахунку</h2>
      <p>Оберіть суму для внесення на баланс</p>

      <div class="deposit-options">
        <button (click)="depositAmount = 100">100 ₴</button>
        <button (click)="depositAmount = 500">500 ₴</button>
        <button (click)="depositAmount = 1000">1000 ₴</button>
        <button (click)="depositAmount = 5000">5000 ₴</button>
      </div>

      <div class="custom-amount">
        <label>Або введіть свою суму:</label>
        <input type="number" #depInput [value]="depositAmount" (input)="depositAmount = depInput.valueAsNumber || 0" min="1">
      </div>

      <button class="btn-submit-deposit" (click)="makeDeposit()">
        ПОПОВНИТИ НА {{ depositAmount }} ₴
      </button>
    </div>
  </div>
}
