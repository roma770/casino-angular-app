<div class="slot-container">
  <h2>Удачливый Слот</h2>
  
  <div class="balance-info">
    <p>Ставка: <strong>{{ bet }} ₽</strong></p>
  </div>

  <div class="reels" [class.spinning]="isSpinning">
    @for (reel of reels; track $index) {
      <div class="reel">{{ reel }}</div>
    }
  </div>

  <p class="message">{{ message }}</p>

  <button (click)="spin()" [disabled]="isSpinning">
    {{ isSpinning ? 'Крутится...' : 'КРУТИТЬ (10 ₽)' }}
  </button>
</div>
